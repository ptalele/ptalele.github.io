<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpakTrader &mdash; Redirecting&hellip;</title>
    <meta name="robots" content="noindex" />
    <!-- Instant redirect for browsers that honor meta refresh -->
    <meta http-equiv="refresh" content="0; url=https://spaktrader.streamlit.app/" />
    <link rel="canonical" href="https://spaktrader.streamlit.app/" />
    <script>
      // Primary redirect. Use replace() so /spak doesn't sit in history.
      window.location.replace('https://spaktrader.streamlit.app/');
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0e14;
        color: #e6e9f0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
      }
      .wrap {
        height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      .spinner {
        width: 38px;
        height: 38px;
        margin: 0 auto 20px;
        border: 3px solid #232a3a;
        border-top-color: #5b8cff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      a {
        color: #5b8cff;
      }
      .muted {
        color: #97a0b5;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="spinner" aria-hidden="true"></div>
        <h1 style="margin: 0 0 8px; font-size: 22px">Opening SpakTrader&hellip;</h1>
        <p class="muted">
          If you are not redirected automatically,
          <a href="https://spaktrader.streamlit.app/">click here to continue</a>.
        </p>
      </div>
    </div>
  </body>
</html>
